<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Городской сервис</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f2f6f9;
}

header {
    background: #2980b9;
    color: white;
    text-align: center;
    padding: 15px;
}

/* верхние вкладки */
.tabs {
    display: flex;
    background: #1f6fa5;
}

.tabs button {
    flex: 1;
    padding: 15px;
    border: none;
    cursor: pointer;
    background: #1f6fa5;
    color: white;
}

.tabs button:hover {
    background: #155a86;
}

/* секции */
.container {
    padding: 20px;
    display: none;
}

.active {
    display: block;
}

/* карточки услуг */
.grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.card {
    background: white;
    padding: 15px;
    width: 180px;
    border-radius: 10px;
    box-shadow: 0 0 5px #ccc;
    cursor: pointer;
}

/* окно информации */
.infoBox {
    margin-top: 20px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    display: none;
}
</style>
</head>

<body>

<header>
<h1>🏙 Городской сервис</h1>
</header>

<!-- ВКЛАДКИ -->
<div class="tabs">
<button onclick="openTab('home')">Главная</button>
<button onclick="openTab('services')">Услуги</button>
<button onclick="openTab('ai')">ИИ-ассистент</button>
</div>

<!-- ГЛАВНАЯ -->
<div id="home" class="container active">
<h2>Добро пожаловать</h2>
<p>Городской портал для жителей</p>
</div>

<!-- УСЛУГИ -->
<div id="services" class="container">

<h2>🏙 Услуги города</h2>

<div class="grid">

<div class="card" onclick="showInfo('jkh')">🏠 ЖКХ</div>
<div class="card" onclick="showInfo('transport')">🚍 Транспорт</div>
<div class="card" onclick="showInfo('docs')">📄 Документы</div>
<div class="card" onclick="showInfo('hospital')">🏥 Поликлиники</div>
<div class="card" onclick="showInfo('police')">🚓 Полиция</div>
<div class="card" onclick="showInfo('water')">🚰 Вода</div>
<div class="card" onclick="showInfo('light')">💡 Электричество</div>
<div class="card" onclick="showInfo('job')">💼 Работа</div>

</div>

<!-- окно информации -->
<div id="info" class="infoBox"></div>

</div>

<!-- ИИ -->
<div id="ai" class="container">

<h2>🤖 ИИ-ассистент</h2>

<input id="input" placeholder="например: нет воды, как оформить документы">
<button onclick="chat()">Спросить</button>

<p id="output"></p>

</div>

<script>

// вкладки
function openTab(tab){
document.querySelectorAll(".container").forEach(c=>c.classList.remove("active"));
document.getElementById(tab).classList.add("active");
}

// =====================
// информация по услугам
// =====================
function showInfo(type){

let box = document.getElementById("info");
box.style.display = "block";

let text = "";

if(type === "jkh"){
text = "🏠 ЖКХ: обслуживание домов, ремонт, заявки через 109 или управляющую компанию.";
}
else if(type === "transport"){
text = "🚍 Транспорт: расписание автобусов через 2GIS или CTS.";
}
else if(type === "docs"){
text = "📄 Документы: оформление в ЦОН или через eGov портал.";
}
else if(type === "hospital"){
text = "🏥 Поликлиники: запись к врачу через eGov или регистратуру.";
}
else if(type === "police"){
text = "🚓 Полиция: экстренный номер 102.";
}
else if(type === "water"){
text = "🚰 Вода: при отключении звонить в водоканал или аварийную службу.";
}
else if(type === "light"){
text = "💡 Электричество: проверка аварий на сайте электросетей.";
}
else if(type === "job"){
text = "💼 Работа: вакансии доступны на enbek.kz";
}

box.innerText = text;
}

// =====================
// ИИ ассистент
// =====================
function chat(){

let text = document.getElementById("input").value.toLowerCase();
let output = document.getElementById("output");

output.innerText = "🧠 ИИ анализирует...";

setTimeout(()=>{

let answer = "📌 Обратитесь в городской центр";

if(text.includes("жкх") || text.includes("дом")){
answer = "🏠 ЖКХ: заявки через 109 или УК";
}
else if(text.includes("вода")){
answer = "🚰 Возможно авария, звоните в водоканал";
}
else if(text.includes("свет")){
answer = "💡 Проверьте аварийные отключения";
}
else if(text.includes("транспорт")){
answer = "🚍 Используйте 2GIS или CTS";
}
else if(text.includes("документ")){
answer = "📄 Оформление в ЦОН или eGov";
}
else if(text.includes("полиция")){
answer = "🚓 102 — полиция";
}

output.innerText = answer;

}, 700);

}

</script>

</body>
</html>
